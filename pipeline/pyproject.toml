[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hoshimachi-pipeline"
version = "1.0.0"
description = "Builds and validates the data behind the Hoshimachi stargazing trip planner."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "pillow>=10",
  "pykakasi>=2.2",
]

[project.optional-dependencies]
# Automated exports from Google Earth Engine to Google Cloud Storage (yearly update)
earthengine = ["earthengine-api>=0.1.390", "google-cloud-storage>=2.14"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
hoshimachi = "hoshimachi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Prefecture name tables: wide CJK strings read better unwrapped.
"src/hoshimachi_pipeline/names.py" = ["E501"]
